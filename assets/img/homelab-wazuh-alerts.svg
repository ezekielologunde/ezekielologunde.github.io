<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="t d"><title id="t">Host-based detection alerts, last 7 days</title><desc id="d">About 3,700 alerts in 7 days from the host-based intrusion detection manager. Most are level 7 rootcheck anomaly events; the rest are file integrity, new file, package and benchmark-status alerts.</desc>
