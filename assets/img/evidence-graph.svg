<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" role="img" aria-labelledby="gt gd">
<title id="gt">Breakwater evidence graph, OpenSSH 8.4p1 on a simulated lab router</title>
<desc id="gd">Directed graph with 23 nodes and 22 edges from a doctoral coursework notebook run. A simulated lab router exposes SSH on TCP port 22, identified as OpenSSH 8.4p1. The CPE is affected by ten CVEs, each linked to one patch or mitigate action. Ranked by fused triage score: CVE-2023-38408 score 16.24 (CVSS 9.8, EPSS 0.64); CVE-2025-26465 score 13.05 (CVSS 6.8, EPSS 0.62); CVE-2023-48795 score 11.32 (CVSS 5.9, EPSS 0.54); CVE-2008-3844 score 9.57 (CVSS 9.3, EPSS 0.03); CVE-2023-51385 score 8.22 (CVSS 6.5, EPSS 0.17); CVE-2026-35385 score 7.51 (CVSS 7.5, EPSS 0.00); CVE-2021-28041 score 7.13 (CVSS 7.1, EPSS 0.00); CVE-2021-41617 score 7.03 (CVSS 7.0, EPSS 0.00); CVE-2023-51767 score 7.00 (CVSS 7.0, EPSS 0.00); CVE-2016-20012 score 6.76 (CVSS 5.3, EPSS 0.15). None of the ten is in the CISA KEV catalog.</desc>
